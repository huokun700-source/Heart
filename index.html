
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Love ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #020208;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #heart {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .love {
            position: absolute;
            color: #39baff;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;

            text-shadow:
                0 0 5px #008cff,
                0 0 10px #008cff,
                0 0 20px #0066ff,
                0 0 30px #0066ff;

            animation: appear 2.5s ease forwards;
        }

        @keyframes appear {
            0% {
                opacity: 0;
                transform: scale(0.3);
                filter: blur(5px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: #168cff;
            font-size: clamp(17px, 4vw, 27px);
            font-weight: bold;
            white-space: nowrap;

            text-shadow:
                0 0 10px #008cff,
                0 0 25px #008cff,
                0 0 40px #0066ff;

            z-index: 10;
            animation: centerGlow 2s infinite alternate;
        }

        @keyframes centerGlow {
            from {
                text-shadow: 0 0 10px #008cff;
            }

            to {
                text-shadow:
                    0 0 20px #008cff,
                    0 0 40px #008cff;
            }
        }

    </style>
</head>

<body>

    <div id="heart">

        <div class="center-text">
            I LOVE YOU ❤️
        </div>

    </div>

    <script>

        const heart = document.getElementById("heart");

        // စာသားအရေအတွက်
        const total = 450;

        // ဖုန်းနဲ့ ကွန်ပျူတာအတွက် အရွယ်အစား
        function getScale() {
            return Math.min(
                window.innerWidth * 0.025,
                18
            );
        }

        const scale = getScale();

        // Heart Animation
        for (let i = 0; i < total; i++) {

            // Heart ပတ်လည်ကို အစဉ်လိုက် ဖြန့်မယ်
            const t = (i / total) * Math.PI * 2;

            // Heart Shape Formula
            const x = 16 * Math.pow(Math.sin(t), 3);

            const y =
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);

            // စာသားဖန်တီးခြင်း
            const text = document.createElement("div");

            text.className = "love";

            text.innerText =
                i % 3 === 0
                ? "I LOVE YOU ❤️"
                : i % 2 === 0
                ? "Love You"
                : "I LOVE YOU";

            // နေရာချထားခြင်း
            text.style.left =
                `calc(50% + ${x * scale}px)`;

            text.style.top =
                `calc(50% - ${y * scale}px)`;

            // စာလုံးအရွယ်အစား
            text.style.fontSize =
                (8 + Math.random() * 5) + "px";

            // ဖြည်းဖြည်းချင်း ပေါ်လာစေခြင်း
            text.style.animationDelay =
                (i * 0.022) + "s";

            heart.appendChild(text);
        }

    </script>

</body>
</html>
